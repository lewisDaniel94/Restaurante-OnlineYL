<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Sabor de Lewis - Restaurante Online</title>
    <!-- Tailwind CSS CDN para estilos rápidos y modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Enlace al archivo CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-utensils text-amber-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">El Sabor de Lewis</h1>
            </div>
            <!-- Botón del Carrito -->
            <button id="openCartBtn" class="relative bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-lg flex items-center space-x-2 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Pedido</span>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold shadow">0</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Sección de Bienvenida y Buscador -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Haz tu pedido en línea</h2>
            <p class="text-slate-600 mb-6">Selecciona tus platillos favoritos y recíbelos directo en casa.</p>
            
            <div class="max-w-md mx-auto relative">
                <input type="text" id="searchInput" placeholder="Buscar platillo o bebida..." class="w-full px-4 py-3 pl-12 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
            </div>
        </div>

        <!-- Filtros de Categorías -->
        <div class="flex justify-center space-x-2 md:space-x-4 mb-8 overflow-x-auto pb-2" id="categoryFilters">
            <button data-category="all" class="category-btn active px-4 py-2 rounded-full font-medium text-sm transition bg-amber-500 text-slate-900 shadow">Todos</button>
            <button data-category="hamburguesas" class="category-btn px-4 py-2 rounded-full font-medium text-sm transition bg-white text-slate-600 hover:bg-slate-100 shadow-sm">Hamburguesas</button>
            <button data-category="pizzas" class="category-btn px-4 py-2 rounded-full font-medium text-sm transition bg-white text-slate-600 hover:bg-slate-100 shadow-sm">Pizzas</button>
            <button data-category="salchipapas" class="category-btn px-4 py-2 rounded-full font-medium text-sm transition bg-white text-slate-600 hover:bg-slate-100 shadow-sm">Salchipapas</button>
            <button data-category="bebidas" class="category-btn px-4 py-2 rounded-full font-medium text-sm transition bg-white text-slate-600 hover:bg-slate-100 shadow-sm">Bebidas</button>
        </div>

        <!-- Cuadrícula de Productos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Los productos se inyectan dinámicamente mediante JavaScript -->
        </div>
    </main>

    <!-- CARRITO DE COMPRAS / PANEL LATERAL (DRAWER) -->
    <div id="cartDrawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <!-- Fondo oscuro semitransparente -->
        <div id="cartOverlay" class="absolute inset-0 bg-black/50 transition-opacity"></div>

        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                
                <!-- Cabecera del Carrito -->
                <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                    <h3 class="text-lg font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-cart-shopping text-amber-400"></i>
                        <span>Tu Carrito de Pedido</span>
                    </h3>
                    <button id="closeCartBtn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
                </div>

                <!-- Lista de Productos en el Carrito -->
                <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4 divide-y divide-slate-100">
                    <p class="text-center text-slate-400 py-8">Tu carrito está vacío</p>
                </div>

                <!-- Formulario de Datos y Total -->
                <div class="p-4 bg-slate-50 border-t border-slate-200">
                    <div class="flex justify-between items-center mb-4 text-lg font-bold">
                        <span>Total a Pagar:</span>
                        <span id="cartTotal" class="text-amber-600">$0.00</span>
                    </div>

                    <form id="checkoutForm" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre y Apellido</label>
                            <input type="text" id="clientName" required placeholder="Ej. Carlos Pérez" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Dirección de Entrega</label>
                            <input type="text" id="clientAddress" required placeholder="Calle, Urbanización, Casa/Apto" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Método de Pago</label>
                            <select id="clientPayment" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                                <option value="Efectivo">Efectivo (USD / Moneda Local)</option>
                                <option value="Pago Móvil / Transferencia">Pago Móvil / Transferencia</option>
                            
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Notas adicionales (Opcional)</label>
                            <input type="text" id="clientNotes" placeholder="Ej. Sin salsa de ajo, por favor" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg mt-2">
                            <i class="fa-brands fa-whatsapp text-xl"></i>
                            <span>Enviar Pedido por WhatsApp</span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="app.js"></script>

    <!-- MODAL PARA AMPLIAR IMAGEN -->
<div id="imageModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden p-4" onclick="closeImageModal()">
    <div class="relative max-w-2xl w-full bg-white rounded-2xl overflow-hidden shadow-2xl p-2" onclick="event.stopPropagation()">
        <button onclick="closeImageModal()" class="absolute top-4 right-4 bg-slate-900/70 hover:bg-slate-900 text-white w-9 h-9 rounded-full flex items-center justify-center font-bold text-lg z-10 transition">
            &times;
        </button>
        <img id="modalImage" src="" alt="Imagen Ampliada" class="w-full h-auto max-h-[75vh] object-contain rounded-xl">
        <h3 id="modalTitle" class="text-center font-bold text-xl text-slate-900 mt-3 mb-2"></h3>
    </div>
</div>
</body>
</html>
